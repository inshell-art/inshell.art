name: deploy-pages

on:
  workflow_dispatch:
    inputs:
      target:
        description: Pages app to deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - home
          - thought
      branch:
        description: Cloudflare Pages deployment branch
        required: true
        default: staging
        type: choice
        options:
          - staging
          - main
      home_measurement:
        description: Home-only measurement (requires separately reviewed production qualification)
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - qualified-home-v1

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-pages-${{ github.event.inputs.target }}-${{ github.event.inputs.branch }}
  cancel-in-progress: false

jobs:
  deploy-home:
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'home' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_PAGES_PROJECT_HOME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_HOME || 'inshell-art' }}
      VITE_DEPLOY_ENV: ${{ github.event.inputs.branch == 'staging' && 'preview' || 'production' }}
      VITE_NETWORK: ${{ vars.VITE_NETWORK || 'sepolia' }}
      VITE_PATH_RPC_URL: ${{ github.event.inputs.branch == 'staging' && '/api/path-rpc' || vars.VITE_PATH_RPC_URL || vars.VITE_ETH_RPC || '/api/path-rpc' }}
      VITE_WALLET_CHAIN_RPC_URL: ${{ vars.VITE_WALLET_CHAIN_RPC_URL || 'https://ethereum-sepolia-rpc.publicnode.com' }}
      VITE_WALLETCONNECT_PROJECT_ID: ${{ vars.VITE_WALLETCONNECT_PROJECT_ID }}
      VITE_PUBLIC_LAUNCH_MODE: ${{ vars.VITE_PUBLIC_LAUNCH_MODE || 'sepolia_invite' }}
      VITE_REPORT_BUG_URL: ${{ vars.VITE_REPORT_BUG_URL || 'https://github.com/inshell-art/inshell.art/issues/new?template=sepolia-bug.md' }}
      VITE_GITHUB_URL: ${{ vars.VITE_GITHUB_URL || 'https://github.com/inshell-art/' }}
      VITE_DEBUG_PANEL: ${{ vars.VITE_DEBUG_PANEL || 'off' }}
      # Default/preview OFF. A future explicit production dispatch also needs
      # the independently reviewed configuration qualification, never shape alone.
      VITE_CLOUDFLARE_WEB_ANALYTICS_ENABLED: ${{ github.event.inputs.branch == 'main' && github.event.inputs.home_measurement == 'qualified-home-v1' && vars.INSHELL_HOME_MEASUREMENT_QUALIFIED == 'home-document-v1' && 'true' || 'false' }}
      VITE_CLOUDFLARE_WEB_ANALYTICS_POLICY: ${{ github.event.inputs.branch == 'main' && github.event.inputs.home_measurement == 'qualified-home-v1' && vars.INSHELL_HOME_MEASUREMENT_QUALIFIED == 'home-document-v1' && 'home-document-v1' || '' }}
      VITE_CLOUDFLARE_WEB_ANALYTICS_SITE_TAG: ${{ github.event.inputs.branch == 'main' && github.event.inputs.home_measurement == 'qualified-home-v1' && vars.INSHELL_HOME_MEASUREMENT_QUALIFIED == 'home-document-v1' && vars.VITE_CLOUDFLARE_WEB_ANALYTICS_SITE_TAG || '' }}
      VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ github.event.inputs.branch == 'main' && github.event.inputs.home_measurement == 'qualified-home-v1' && vars.INSHELL_HOME_MEASUREMENT_QUALIFIED == 'home-document-v1' && (vars.VITE_CLOUDFLARE_WEB_ANALYTICS_HOME_TOKEN || vars.VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN) || '' }}
      VITE_THOUGHT_URL: ${{ github.event.inputs.branch == 'staging' && 'https://preview.inshell.art/thought' || vars.VITE_THOUGHT_URL || 'https://inshell.art/thought' }}
      VITE_GALLERY_URL: ${{ github.event.inputs.branch == 'staging' && 'https://preview.inshell.art/gallery' || vars.VITE_GALLERY_URL || vars.VITE_THOUGHT_GALLERY_URL || 'https://inshell.art/gallery' }}
      VITE_THOUGHT_GALLERY_URL: ${{ github.event.inputs.branch == 'staging' && 'https://preview.inshell.art/gallery' || vars.VITE_GALLERY_URL || vars.VITE_THOUGHT_GALLERY_URL || 'https://inshell.art/gallery' }}
      VITE_PUBLIC_TELEGRAM_CHANNEL_URL: ${{ vars.VITE_PUBLIC_TELEGRAM_CHANNEL_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0
      - name: Enable pnpm
        run: corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Validate requested Home measurement policy
        env:
          REQUESTED_HOME_MEASUREMENT: ${{ github.event.inputs.home_measurement || 'off' }}
          REQUESTED_DEPLOY_BRANCH: ${{ github.event.inputs.branch }}
          REQUESTED_DEPLOY_TARGET: ${{ github.event.inputs.target }}
          HOME_MEASUREMENT_QUALIFICATION: ${{ vars.INSHELL_HOME_MEASUREMENT_QUALIFIED }}
          HOME_MEASUREMENT_SITE_TAG: ${{ vars.VITE_CLOUDFLARE_WEB_ANALYTICS_SITE_TAG }}
          HOME_MEASUREMENT_TOKEN: ${{ vars.VITE_CLOUDFLARE_WEB_ANALYTICS_HOME_TOKEN || vars.VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: |
          node <<'NODE'
          const e = process.env;
          const request = e.REQUESTED_HOME_MEASUREMENT;
          if (request === 'off') process.exit(0);
          if (request !== 'qualified-home-v1' || e.REQUESTED_DEPLOY_BRANCH !== 'main' ||
              !['home', 'all'].includes(e.REQUESTED_DEPLOY_TARGET) ||
              e.HOME_MEASUREMENT_QUALIFICATION !== 'home-document-v1' ||
              !/^[a-f0-9]{32}$/.test(e.HOME_MEASUREMENT_SITE_TAG || '') ||
              !/^[a-f0-9]{32}$/.test(e.HOME_MEASUREMENT_TOKEN || '')) {
            throw new Error('Requested Home measurement requires main, a Home target, reviewed qualification, and valid public identifiers.');
          }
          NODE
      - name: Install zsh
        run: |
          if command -v zsh >/dev/null 2>&1; then
            zsh --version
          else
            sudo apt-get install --yes zsh
            zsh --version
          fi
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate deployment integrity before publishing
        run: pnpm run check:thought-production-readiness
      - name: Require reviewed real-agent evidence before production publishing
        if: ${{ github.event.inputs.branch == 'main' }}
        run: pnpm run check:release-evidence
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf
        with:
          version: v1.5.1
          cache: false
      - name: Verify Anvil
        run: anvil --version
      - name: Check deploy config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_PAGES_PROJECT_HOME"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$VITE_PATH_RPC_URL"
          test -n "$VITE_WALLET_CHAIN_RPC_URL"
          test -n "$VITE_THOUGHT_URL"
          test -n "$VITE_GALLERY_URL"
      - name: Check public documentation
        run: pnpm run docs:check
      - name: Check upstream release freshness
        run: pnpm run check:upstream-releases
      - name: Verify PATH contract release
        run: pnpm run check:path-contract-release
      - name: Validate deployment gates
        run: pnpm run check:deployment
      - name: Check PUB path boundary
        run: pnpm run pub-boundary:check
      - name: Test deployment smoke regressions
        run: node --test --test-name-pattern=smoke scripts/release-readiness.test.mjs
      - name: Lint home
        run: pnpm --filter @inshell/home lint
      - name: Test home launch surface
        run: pnpm run test:presepolia
      - name: Test THOUGHT runtime payloads
        run: pnpm run test:thought-runtime
      - name: Build home
        run: pnpm run build:home
      - name: Verify optional measurement build policy
        run: |
          pnpm run test:privacy
          if [ "$VITE_CLOUDFLARE_WEB_ANALYTICS_ENABLED" = "true" ]; then
            node scripts/check-analytics-off-build.mjs dist/home --qualified-home
          else
            node scripts/check-analytics-off-build.mjs dist/home
          fi
      - name: Deploy home to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.94.0 pages deploy dist/home --project-name="$CLOUDFLARE_PAGES_PROJECT_HOME" --branch="${{ github.event.inputs.branch }}"
      - name: Smoke home API routes
        run: |
          echo "smoke: /api/path-rpc /api/pulse-auction /api/path-tokens /api/ops/status"
          if [ "${{ github.event.inputs.branch }}" = "main" ]; then
            pnpm run smoke:api-routes -- --scope home --home-base https://inshell.art
          else
            pnpm run smoke:api-routes -- --scope home --home-base https://staging.inshell-art.pages.dev
          fi

  deploy-thought:
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'thought' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_PAGES_PROJECT_THOUGHT: ${{ vars.CLOUDFLARE_PAGES_PROJECT_THOUGHT || 'thought-inshell-art' }}
      VITE_DEPLOY_ENV: ${{ github.event.inputs.branch == 'staging' && 'preview' || 'production' }}
      VITE_NETWORK: ${{ vars.VITE_NETWORK || 'sepolia' }}
      VITE_PATH_RPC_URL: ${{ github.event.inputs.branch == 'staging' && '/api/path-rpc' || vars.VITE_PATH_RPC_URL || vars.VITE_ETH_RPC || '/api/path-rpc' }}
      VITE_THOUGHT_RPC_URL: ${{ github.event.inputs.branch == 'staging' && '/api/thought-rpc' || vars.VITE_THOUGHT_RPC_URL || '/api/thought-rpc' }}
      VITE_THOUGHT_PREVIEW_ENDPOINT_ENABLED: ${{ vars.VITE_THOUGHT_PREVIEW_ENDPOINT_ENABLED || 'true' }}
      VITE_THOUGHT_PREVIEW_ENDPOINT_URL: ${{ github.event.inputs.branch == 'staging' && '/api/thought-preview' || vars.VITE_THOUGHT_PREVIEW_ENDPOINT_URL || '/api/thought-preview' }}
      VITE_WALLET_CHAIN_RPC_URL: ${{ vars.VITE_WALLET_CHAIN_RPC_URL || 'https://ethereum-sepolia-rpc.publicnode.com' }}
      VITE_PATH_MINT_URL: ${{ github.event.inputs.branch == 'staging' && 'https://preview.inshell.art/path' || vars.VITE_PATH_MINT_URL || 'https://inshell.art/path' }}
      VITE_THOUGHT_DETAIL_BASE_URL: ${{ github.event.inputs.branch == 'staging' && 'https://preview.inshell.art/thought' || vars.VITE_THOUGHT_DETAIL_BASE_URL || 'https://inshell.art/thought' }}
      VITE_GALLERY_URL: ${{ github.event.inputs.branch == 'staging' && 'https://preview.inshell.art/gallery' || vars.VITE_GALLERY_URL || vars.VITE_THOUGHT_GALLERY_URL || 'https://inshell.art/gallery' }}
      VITE_THOUGHT_GALLERY_URL: ${{ github.event.inputs.branch == 'staging' && 'https://preview.inshell.art/gallery' || vars.VITE_GALLERY_URL || vars.VITE_THOUGHT_GALLERY_URL || 'https://inshell.art/gallery' }}
      VITE_THOUGHT_EXPLORER_BASE_URL: ${{ vars.VITE_THOUGHT_EXPLORER_BASE_URL || 'https://sepolia.etherscan.io' }}
      VITE_PUBLIC_LAUNCH_MODE: ${{ vars.VITE_PUBLIC_LAUNCH_MODE || 'sepolia_invite' }}
      VITE_REPORT_BUG_URL: ${{ vars.VITE_REPORT_BUG_URL || 'https://github.com/inshell-art/inshell.art/issues/new?template=sepolia-bug.md' }}
      VITE_GITHUB_URL: ${{ vars.VITE_GITHUB_URL || 'https://github.com/inshell-art/' }}
      # Collection remains off pending regional, navigation and injection qualification.
      VITE_CLOUDFLARE_WEB_ANALYTICS_ENABLED: "false"
      VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ""
      VITE_CLOUDFLARE_WEB_ANALYTICS_POLICY: ""
      VITE_CLOUDFLARE_WEB_ANALYTICS_SITE_TAG: ""
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0
      - name: Enable pnpm
        run: corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Validate requested Home measurement policy
        env:
          REQUESTED_HOME_MEASUREMENT: ${{ github.event.inputs.home_measurement || 'off' }}
          REQUESTED_DEPLOY_BRANCH: ${{ github.event.inputs.branch }}
          REQUESTED_DEPLOY_TARGET: ${{ github.event.inputs.target }}
          HOME_MEASUREMENT_QUALIFICATION: ${{ vars.INSHELL_HOME_MEASUREMENT_QUALIFIED }}
          HOME_MEASUREMENT_SITE_TAG: ${{ vars.VITE_CLOUDFLARE_WEB_ANALYTICS_SITE_TAG }}
          HOME_MEASUREMENT_TOKEN: ${{ vars.VITE_CLOUDFLARE_WEB_ANALYTICS_HOME_TOKEN || vars.VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: |
          node <<'NODE'
          const e = process.env;
          const request = e.REQUESTED_HOME_MEASUREMENT;
          if (request === 'off') process.exit(0);
          if (request !== 'qualified-home-v1' || e.REQUESTED_DEPLOY_BRANCH !== 'main' ||
              !['home', 'all'].includes(e.REQUESTED_DEPLOY_TARGET) ||
              e.HOME_MEASUREMENT_QUALIFICATION !== 'home-document-v1' ||
              !/^[a-f0-9]{32}$/.test(e.HOME_MEASUREMENT_SITE_TAG || '') ||
              !/^[a-f0-9]{32}$/.test(e.HOME_MEASUREMENT_TOKEN || '')) {
            throw new Error('Requested Home measurement requires main, a Home target, reviewed qualification, and valid public identifiers.');
          }
          NODE
      - name: Install zsh
        run: |
          if command -v zsh >/dev/null 2>&1; then
            zsh --version
          else
            sudo apt-get install --yes zsh
            zsh --version
          fi
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf
        with:
          version: v1.5.1
          cache: false
      # This job is independently publishable; repeat the same integrity gate.
      - name: Validate deployment integrity before publishing
        run: pnpm run check:thought-production-readiness
      - name: Require reviewed real-agent evidence before production publishing
        if: ${{ github.event.inputs.branch == 'main' }}
        run: pnpm run check:release-evidence
      - name: Check dependency security and release guard regressions
        run: pnpm run check:dependency-security && pnpm run test:release-readiness
      - name: Verify Anvil
        run: anvil --version
      - name: Check deploy config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_PAGES_PROJECT_THOUGHT"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$VITE_PATH_RPC_URL"
          test -n "$VITE_THOUGHT_RPC_URL"
          test -n "$VITE_THOUGHT_PREVIEW_ENDPOINT_ENABLED"
          test -n "$VITE_THOUGHT_PREVIEW_ENDPOINT_URL"
          test -n "$VITE_WALLET_CHAIN_RPC_URL"
          test -n "$VITE_PATH_MINT_URL"
          test -n "$VITE_THOUGHT_DETAIL_BASE_URL"
          test -n "$VITE_GALLERY_URL"
      - name: Check public documentation
        run: pnpm run docs:check
      - name: Check upstream release freshness
        run: pnpm run check:upstream-releases
      - name: Verify PATH contract release
        run: pnpm run check:path-contract-release
      - name: Validate deployment gates
        run: pnpm run check:deployment
      - name: Check PUB path boundary
        run: pnpm run pub-boundary:check
      - name: Test deployment smoke regressions
        run: node --test --test-name-pattern=smoke scripts/release-readiness.test.mjs
      - name: Test shared Home and Pages API surfaces
        run: pnpm run test:unit
      - name: Test THOUGHT runtime payloads
        run: pnpm run test:thought-runtime
      - name: Check THOUGHT renderer parity
        env:
          THOUGHT_RENDER_PARITY_RPC_URL: ${{ vars.THOUGHT_RENDER_PARITY_RPC_URL || vars.VITE_WALLET_CHAIN_RPC_URL || 'https://ethereum-sepolia-rpc.publicnode.com' }}
        run: pnpm run check:thought-renderer-parity
      - name: Type-check THOUGHT
        run: pnpm --filter @inshell/thought type-check
      - name: Build THOUGHT
        run: pnpm run build:thought
      - name: Verify optional measurement remains off
        run: |
          pnpm run test:privacy
          node scripts/check-analytics-off-build.mjs dist/thought
      - name: Deploy THOUGHT to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.94.0 pages deploy dist/thought --project-name="$CLOUDFLARE_PAGES_PROJECT_THOUGHT" --branch="${{ github.event.inputs.branch }}"
      - name: Smoke THOUGHT API routes
        run: |
          echo "smoke: /api/path-rpc /api/thought-rpc /api/thought-preview /api/thought-gallery /api/path-tokens /api/ops/status"
          if [ "${{ github.event.inputs.branch }}" = "main" ]; then
            pnpm run smoke:api-routes -- --scope thought --thought-base https://thought.inshell.art
          else
            pnpm run smoke:api-routes -- --scope thought --thought-base https://staging.thought-inshell-art.pages.dev
          fi
